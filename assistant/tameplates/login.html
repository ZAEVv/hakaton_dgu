{% extends 'staff_base.html' %}
{% block title %}Вход сотрудника{% endblock %}
{% block content %}
<h1>Вход сотрудника</h1>
<p>Войдите, чтобы работать с заявками службы колледжа.</p>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>Логин <input name="login" autocomplete="username" required maxlength="80"></label>
<label>Пароль <input type="password" name="password" autocomplete="current-password" required></label><button>Войти</button></form>
<p><a href="{{ url_for('applicant_login') }}">Вход в личный кабинет заявителя</a></p>
{% endblock %}
